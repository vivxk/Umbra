[package]
name = "umbra"
version = "0.1.0"
edition = "2021"
authors = ["Vivek"]
description = "Minimal privacy-first, fail-closed Linux network boundary"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nix = { version = "0.31", features = ["fs", "ioctl", "net", "socket", "user"] }

[dev-dependencies]
tempfile = "3.17"
